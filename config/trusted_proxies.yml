# Reverse proxies that sit in front of this app.
#
# ActionDispatch::RemoteIp scans X-Forwarded-For from the right and returns the
# first address that is not listed here, so every proxy in the chain must be
# listed for the visitor's address to be identified correctly. Rate limiting
# depends on this; see config/initializers/rack_attack.rb.
#
# These are Cloudflare's edge ranges, from https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6, retrieved 2026-08-18. Refresh them when
# Cloudflare publishes changes. A stale list makes rate limiting coarser, since
# visitors get bucketed under an unrecognized edge address, but it cannot cause
# limits to be bypassed.
#
# Rails' own loopback and private ranges are added in config/application.rb.
# Set TRUSTED_PROXY_RANGES (comma separated) to replace this list entirely, for
# deployments that do not sit behind Cloudflare.

